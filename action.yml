# private monorepo, rewritten by scripts/sync-mirror.mjs so that GitHub
# Marketplace, which only reads a root action.yml, can list this action.
# Edits here are overwritten on the next mirror sync.
name: 'Legalithm AI Act Check'
description: 'Fail the build if your committed EU AI Act compliance record (compliance/legalithm.json) has drifted from the current law or your app.'
author: 'Legalithm'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  api-key:
    description: 'Legalithm API key (lgl_...). Store it as a repository secret.'
    required: true
  api-url:
    description: 'Legalithm API base URL.'
    required: false
    default: 'https://www.legalithm.com'
  fail-on:
    description: 'When to fail: risk-or-rule (default) | risk | any | never.'
    required: false
    default: 'risk-or-rule'
  working-directory:
    description: 'Directory containing compliance/legalithm.json.'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        LEGALITHM_API_KEY: ${{ inputs.api-key }}
        LEGALITHM_API_URL: ${{ inputs.api-url }}
        LEGALITHM_FAIL_ON: ${{ inputs.fail-on }}
      run: bash "${{ github.action_path }}/packages/action/entrypoint.sh"
    - name: Upload SARIF
      if: always() && hashFiles(format('{0}/legalithm-results.sarif', inputs.working-directory)) != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ format('{0}/legalithm-results.sarif', inputs.working-directory) }}
        category: legalithm-ai-act
