<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="860" height="470" rx="10" fill="#0d1117"/>
  <rect width="860" height="34" rx="10" fill="#161b22"/>
  <rect y="24" width="860" height="10" fill="#161b22"/>
  <circle cx="20" cy="17" r="5.5" fill="#ff5f57"/>
  <circle cx="40" cy="17" r="5.5" fill="#febc2e"/>
  <circle cx="60" cy="17" r="5.5" fill="#28c840"/>
  <text x="430" y="21" fill="#8b949e" font-size="11.5" text-anchor="middle">claude code — legalithm</text>

  <text font-size="13" xml:space="preserve">
    <tspan x="22" y="66" fill="#58a6ff">&gt;</tspan><tspan fill="#e6edf3"> We're adding CV screening to rank applicants. Does the EU AI Act apply?</tspan>

    <tspan x="22" y="100" fill="#8b949e">● Calling </tspan><tspan fill="#d2a8ff">legalithm — classify</tspan>
    <tspan x="34" y="120" fill="#6e7681">role: provider · domain: employment · audience: workers</tspan>

    <tspan x="22" y="152" fill="#e6edf3">{</tspan>
    <tspan x="38" y="172" fill="#7ee787">"risk"</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#ffa657">"high"</tspan><tspan fill="#e6edf3">,</tspan>
    <tspan x="38" y="192" fill="#7ee787">"confidence"</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#a5d6ff">"high"</tspan><tspan fill="#e6edf3">,</tspan>
    <tspan x="38" y="212" fill="#7ee787">"citations"</tspan><tspan fill="#e6edf3">: [{ </tspan><tspan fill="#7ee787">"article"</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#a5d6ff">"6(2)"</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#7ee787">"annex"</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#a5d6ff">"III"</tspan><tspan fill="#e6edf3">,</tspan>
    <tspan x="54" y="232" fill="#7ee787">"asOf"</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#a5d6ff">"2026-08-03"</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#7ee787">"appliesFrom"</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#a5d6ff">"2027-12-02"</tspan><tspan fill="#e6edf3"> }],</tspan>
    <tspan x="38" y="252" fill="#7ee787">"matchedRules"</tspan><tspan fill="#e6edf3">: [</tspan><tspan fill="#a5d6ff">"high_risk_employment"</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#a5d6ff">"high_risk_domain_selected"</tspan><tspan fill="#e6edf3">],</tspan>
    <tspan x="38" y="272" fill="#7ee787">"obligationsHint"</tspan><tspan fill="#e6edf3">: { </tspan><tspan fill="#7ee787">"count"</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#79c0ff">10</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#7ee787">"topTitles"</tspan><tspan fill="#e6edf3">: [</tspan>
    <tspan x="54" y="292" fill="#a5d6ff">"Quality Management System (Article 17)"</tspan><tspan fill="#e6edf3">,</tspan>
    <tspan x="54" y="312" fill="#a5d6ff">"Data Governance (Article 10)"</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#a5d6ff">"Human Oversight (Article 14)"</tspan><tspan fill="#e6edf3"> ] },</tspan>
    <tspan x="38" y="332" fill="#7ee787">"confidenceScore"</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#79c0ff">0.72</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#7ee787">"reviewRequired"</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#79c0ff">false</tspan>
    <tspan x="22" y="352" fill="#e6edf3">}</tspan>

    <tspan x="22" y="386" fill="#e6edf3">Yes. High-risk under </tspan><tspan fill="#ffa657">Article 6(2)</tspan><tspan fill="#e6edf3"> and </tspan><tspan fill="#ffa657">Annex III</tspan><tspan fill="#e6edf3"> (employment). Obligations</tspan>
    <tspan x="22" y="406" fill="#e6edf3">apply from </tspan><tspan fill="#ffa657">2 December 2027</tspan><tspan fill="#e6edf3">. Ten of them, starting with a quality</tspan>
    <tspan x="22" y="426" fill="#e6edf3">management system, data governance and human oversight.</tspan>
  </text>

  <rect x="22" y="440" width="816" height="18" rx="4" fill="#161b22"/>
  <text x="30" y="453" fill="#6e7681" font-size="10.5">Runs offline. No API key. Checked against Regulation (EU) 2024/1689 as of 2026-08-03. Not legal advice.</text>
</svg>
